<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ala Business</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
header{
    background:#075e54;
    color:white;
    padding:18px;
    font-size:22px;
    font-weight:bold;
}
.container{
    max-width:600px;
    margin:auto;
    background:white;
    min-height:calc(100vh - 60px);
}
.search{
    padding:12px;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:1px solid #ddd;
    border-radius:20px;
}
.chat{
    display:flex;
    align-items:center;
    padding:15px;
    border-bottom:1px solid #eee;
}
.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#128c7e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    margin-left:12px;
}
.name{
    font-weight:bold;
}
.status{
    color:#777;
    margin-top:5px;
    font-size:14px;
}
.empty{
    text-align:center;
    color:#777;
    padding:40px 20px;
}
</style>
</head>
<body>

<div class="container">
<header>💬 Ala Business</header>

<div class="search">
<input placeholder="البحث في المحادثات">
</div>

<div class="chat">
<div class="avatar">👤</div>
<div>
<div class="name">لا توجد محادثات بعد</div>
<div class="status">ستظهر محادثات WhatsApp Business هنا</div>
</div>
</div>

<div class="empty">
📱 التطبيق جاهز للمرحلة التالية<br><br>
سيتم ربطه لاحقًا بواجهة WhatsApp Business الرسمية.
</div>

</div>

</body>
</html>
